{% extends 'base.html' %}

{% block title %}{{ post.title }} · 게시판{% endblock %}

{% block content %}
        <article class="card panel">
            <div class="card-body">
                <h1 class="page-title">{{ post.title }}</h1>
                <p class="meta">No. {{ '%02d'|format(post.id) }} · 본문 {{ post.content|length }}자</p>
                <div class="content">{{ post.content }}</div>
            </div>

            <div class="card-footer d-flex justify-content-between align-items-center">
                <a class="btn btn-text" href="/posts">← 목록</a>
                <div class="d-flex gap-2">
                    <a class="btn btn-ghost" href="/posts/{{ post.id }}/edit">수정</a>
                    <!-- 삭제는 DB를 바꾸는 작업 → 링크(GET)가 아니라 form(POST)으로 -->
                    <!-- onsubmit: 제출 전에 확인창. 취소 누르면 false → 제출 안 됨 -->
                    <form class="m-0" action="/posts/{{ post.id }}/delete" method="post"
                          onsubmit="return confirm('이 글을 삭제할까요?');">
                        <button class="btn btn-ghost" type="submit">삭제</button>
                    </form>
                </div>
            </div>
        </article>
{% endblock %}
