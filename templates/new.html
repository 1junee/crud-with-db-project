{% extends 'base.html' %}

{% block title %}새 글 작성 · 게시판{% endblock %}

{# 이 페이지에선 상단 '새 글 작성' 버튼 숨김 (block을 비워서 덮어씀) #}
{% block topbar_action %}{% endblock %}

{% block content %}
        <form class="card panel" action="/posts/create" method="post">
            <div class="card-body">
                <h1 class="page-title">새 글 작성</h1>

                <!-- name 값(title, content)이 main.py의 Form() 매개변수 이름과 같아야 함 -->
                <div class="mt-4">
                    <label class="form-label" for="title">제목</label>
                    <input class="form-control" type="text" id="title" name="title" placeholder="제목을 입력하세요" required autofocus>
                </div>
                <div class="mt-4">
                    <label class="form-label" for="content">내용</label>
                    <!-- textarea: 여러 줄 입력. input과 달리 닫는 태그 있음 -->
                    <textarea class="form-control" id="content" name="content" placeholder="내용을 입력하세요" required></textarea>
                </div>
            </div>

            <div class="card-footer d-flex justify-content-between align-items-center">
                <a class="btn btn-text" href="/posts">취소</a>
                <button class="btn btn-primary" type="submit">등록</button>
            </div>
        </form>
{% endblock %}
