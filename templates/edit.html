{% extends 'base.html' %}

{% block title %}글 수정 · 게시판{% endblock %}

{% block topbar_action %}{% endblock %}

{% block content %}
        <form class="card panel" action="/posts/{{ post.id }}/update" method="post">
            <div class="card-body">
                <h1 class="page-title">글 수정</h1>
                <p class="meta">No. {{ '%02d'|format(post.id) }}</p>

                <!-- 기존 값 채워두기: input은 value 속성, textarea는 태그 사이 내용 -->
                <div class="mt-4">
                    <label class="form-label" for="title">제목</label>
                    <input class="form-control" type="text" id="title" name="title" value="{{ post.title }}" required>
                </div>
                <div class="mt-4">
                    <label class="form-label" for="content">내용</label>
                    <textarea class="form-control" id="content" name="content" required>{{ post.content }}</textarea>
                </div>
            </div>

            <div class="card-footer d-flex justify-content-between align-items-center">
                <!-- 취소: 수정 안 하고 상세 페이지로 돌아감 -->
                <a class="btn btn-text" href="/posts/{{ post.id }}">취소</a>
                <button class="btn btn-primary" type="submit">저장</button>
            </div>
        </form>
{% endblock %}
