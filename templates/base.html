<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- block: 자식 페이지가 이 부분만 바꿔 끼울 수 있는 빈칸 -->
    <title>{% block title %}게시판{% endblock %}</title>
    <!-- Bootstrap 먼저, 우리 스타일(board.css)을 나중에 → 우리 규칙이 Bootstrap 기본값을 덮어씀 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/css/board.css">
</head>
<body>
    <div class="wrap">
        <header class="topbar d-flex justify-content-between align-items-center">
            <a class="logo" href="/posts">board</a>
            <!-- 오른쪽 버튼: 페이지마다 다름 (기본은 새 글 작성) -->
            {% block topbar_action %}
            <a class="btn btn-primary" href="/posts/new">새 글 작성</a>
            {% endblock %}
        </header>

        {% block content %}{% endblock %}
    </div>
</body>
</html>
